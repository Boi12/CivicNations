modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# NeoForge 1.20.1-47.1.106 still exposes its platform mod as "forge".
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
mandatory=true
versionRange="[9.2.14,10)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftblibrary"
mandatory=true
versionRange="[2001.2.13,2002)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbteams"
mandatory=true
versionRange="[2001.3.2,2002)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbchunks"
mandatory=true
versionRange="[2001.3.8,2002)"
ordering="AFTER"
side="BOTH"
