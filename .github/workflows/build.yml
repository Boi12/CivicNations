name: Build Civic Nations

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Civic Nations
        run: gradle --no-daemon --stacktrace build

      - name: Verify permanent JAR name
        run: test -f build/libs/civicnations-neoforge-1.20.1.jar

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: civicnations-neoforge-1.20.1
          path: build/libs/civicnations-neoforge-1.20.1.jar
          if-no-files-found: error
