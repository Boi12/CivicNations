name: Build Civic Nations

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Reconstruct imported Alpha 5 source
        shell: bash
        run: |
          mkdir -p build-src
          cat bootstrap/source-alpha5.tar.gz.b64.* | base64 --decode > /tmp/civicnations-source.tar.gz
          echo "dbadde07a129a397b76db48203ebb321ca4883a20926aea4e471aaafbbddd630  /tmp/civicnations-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/civicnations-source.tar.gz -C build-src

      - name: Build Civic Nations
        working-directory: build-src/CivicNations-neoforge-source
        run: gradle --no-daemon --stacktrace build

      - name: Verify permanent JAR name
        run: test -f build-src/CivicNations-neoforge-source/build/libs/civicnations-neoforge-1.20.1.jar

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: civicnations-neoforge-1.20.1
          path: build-src/CivicNations-neoforge-source/build/libs/civicnations-neoforge-1.20.1.jar
          if-no-files-found: error
