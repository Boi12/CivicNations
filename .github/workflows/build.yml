name: Build Civic Nations

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - source-tree
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    if: github.ref == 'refs/heads/source-tree'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source-tree
        uses: actions/checkout@v4
        with:
          ref: source-tree
          fetch-depth: 0

      - name: Reconstruct and verify Alpha 5 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/civicnations-expanded
          cat bootstrap/source-alpha5.tar.gz.b64.* | base64 --decode > /tmp/civicnations-source.tar.gz
          echo "dbadde07a129a397b76db48203ebb321ca4883a20926aea4e471aaafbbddd630  /tmp/civicnations-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/civicnations-source.tar.gz -C /tmp/civicnations-expanded

      - name: Replace bootstrap with ordinary source files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='build/' \
            --exclude='run/' \
            /tmp/civicnations-expanded/CivicNations-neoforge-source/ ./
          rm -rf bootstrap
          rm -f .github/workflows/expand-source.yml

      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Alpha 5 into ordinary source files [expanded-source]"
          git push origin HEAD:source-tree

  build:
    if: github.ref != 'refs/heads/source-tree'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Reconstruct imported Alpha 5 source
        shell: bash
        run: |
          mkdir -p build-src
          cat bootstrap/source-alpha5.tar.gz.b64.* | base64 --decode > /tmp/civicnations-source.tar.gz
          echo "dbadde07a129a397b76db48203ebb321ca4883a20926aea4e471aaafbbddd630  /tmp/civicnations-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/civicnations-source.tar.gz -C build-src

      - name: Build Civic Nations
        working-directory: build-src/CivicNations-neoforge-source
        run: gradle --no-daemon --stacktrace build

      - name: Verify permanent JAR name
        run: test -f build-src/CivicNations-neoforge-source/build/libs/civicnations-neoforge-1.20.1.jar

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: civicnations-neoforge-1.20.1
          path: build-src/CivicNations-neoforge-source/build/libs/civicnations-neoforge-1.20.1.jar
          if-no-files-found: error
